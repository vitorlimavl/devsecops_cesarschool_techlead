name: DevSecOps Pipeline - PIX API

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: pix-api
  NODE_VERSION: '20'

jobs:

  # ──────────────────────────────────────────────
  # STAGE 1 — ESLint (Linting de Código)
  # ──────────────────────────────────────────────
  lint:
    name: "Stage 1 - ESLint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

  # ──────────────────────────────────────────────
  # STAGE 2 — Jest (Testes Automatizados)
  # ──────────────────────────────────────────────
  test:
    name: "Stage 2 - Jest Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com cobertura
        run: npm test

      - name: Upload cobertura de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  # ──────────────────────────────────────────────
  # STAGE 3 — Semgrep (SAST)
  # ──────────────────────────────────────────────
  sast-semgrep:
    name: "Stage 3 - Semgrep SAST"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Executar Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/nodejs-security-audit
            p/javascript
            p/owasp-top-ten
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload resultados SARIF para GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ──────────────────────────────────────────────
  # STAGE 4 — Docker Build + Trivy (Container Scan)
  # ──────────────────────────────────────────────
  docker-build-trivy:
    name: "Stage 4 - Docker Build + Trivy"
    runs-on: ubuntu-latest
    needs: [ lint, test, sast-semgrep ]
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

      - name: Executar Trivy - Scan da imagem
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH,MEDIUM"
          output: trivy-results.txt

      - name: Exibir resultados Trivy
        if: always()
        run: cat trivy-results.txt

      - name: Upload resultados Trivy
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-results.txt

      - name: Trivy SARIF upload para GitHub Security
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "sarif"
          output: trivy-results.sarif
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ──────────────────────────────────────────────
  # STAGE 5 — Security Gate
  # ──────────────────────────────────────────────
  security-gate:
    name: "Stage 5 - Security Gate"
    runs-on: ubuntu-latest
    needs: [ docker-build-trivy ]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Avaliar resultados de segurança
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║         SECURITY GATE CHECK            ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "✅ ESLint:   PASSED"
          echo "✅ Jest:     PASSED (cobertura ≥ 60%)"
          echo "✅ Semgrep:  COMPLETED"
          echo "✅ Docker:   BUILD OK"
          echo "✅ Trivy:    SCAN COMPLETED"
          echo ""
          echo "══════════════════════════════════════════"
          echo "RESULTADO: PIPELINE APROVADA - DEPLOY AUTORIZADO"
          echo "══════════════════════════════════════════"

  # ──────────────────────────────────────────────
  # STAGE 6 — ZAP DAST (Dynamic Security Testing)
  # ──────────────────────────────────────────────
  dast-zap:
    name: "Stage 6 - ZAP DAST"
    runs-on: ubuntu-latest
    needs: [ security-gate ]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências de produção
        run: npm ci --only=production

      - name: Iniciar aplicação em background
        run: |
          npm start &
          echo "APP_PID=$!" >> $GITHUB_ENV
          echo "Aguardando aplicação iniciar..."
          timeout 30 bash -c 'until curl -s http://localhost:3000/health > /dev/null; do sleep 1; done'
          echo "✅ Aplicação iniciada"

      - name: Verificar saúde da aplicação
        run: |
          curl -s http://localhost:3000/health | python3 -m json.tool

      - name: ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
          fail_action: false
        continue-on-error: true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json

  # ──────────────────────────────────────────────
  # STAGE 7 — Deploy (Kubernetes / Simulado)
  # ──────────────────────────────────────────────
  deploy:
    name: "Stage 7 - Deploy"
    runs-on: ubuntu-latest
    needs: [ dast-zap ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v3

      - name: Validar manifestos Kubernetes
        run: |
          kubectl apply --dry-run=client -f k8s/deployment.yaml
          kubectl apply --dry-run=client -f k8s/service.yaml
          echo "✅ Manifestos Kubernetes validados (dry-run)"

      - name: Resumo do Deploy
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║           DEPLOY SUMMARY               ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "Imagem: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Autor:  ${{ github.actor }}"
          echo ""
          echo "✅ Manifesto deployment.yaml validado"
          echo "✅ Manifesto service.yaml validado"
          echo "✅ Pipeline DevSecOps completa com sucesso"
